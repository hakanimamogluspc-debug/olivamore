# Olivamore — temiz URL'ler
# /sayfa -> sayfa.html sunulur (ana conf'taki try_files $uri.html ile)
# .html ile gelen istekler temiz adrese 301 yönlenir

# Panel: temiz adres de şifre korumalı olmalı
location = /panel {
    auth_basic "Olivamore Yonetim";
    auth_basic_user_file /etc/nginx/.htpasswd;
    try_files /panel.html =404;
}

# Ana sayfa kanonik: /index.html -> /
location = /index.html { return 301 /; }

# EN ana sayfa kanonik: /en (index-en adi hic gorunmez)
location = /en { try_files /index-en.html =404; }
location = /index-en.html { return 301 /en; }
location = /index-en { return 301 /en; }

# Diğer tüm .html'ler -> uzantısız (sorgu parametreleri korunur, ör. p.html?id=x -> /p?id=x)
# Not: panel.html bu kurala girmez; ana conf'taki "location = /panel.html" (exact) önceliklidir.
location ~ "^(?<temiz>/.+)\.html$" { return 301 $temiz$is_args$args; }
