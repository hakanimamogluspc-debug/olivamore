# Olivamore — temiz URL'ler
# /sayfa -> sayfa.html sunulur (ana conf'taki try_files $uri.html ile)
# .html ile gelen istekler temiz adrese 301 yonlenir
#
# ONEMLI: 301'ler yalniz ziyaretci GERCEKTEN .html istediginde ($request_uri)
# calisir. Nginx'in dahili yonlendirmeleri (index -> /index.html gibi)
# $request_uri'yi degistirmez; boylece yonlendirme dongusu olusmaz.

# Panel: temiz adres de sifre korumali olmali
location = /panel {
    auth_basic "Olivamore Yonetim";
    auth_basic_user_file /etc/nginx/.htpasswd;
    try_files /panel.html =404;
}

# Ana sayfa kanonik: /index.html -> /  (dahili istekte dosya normal sunulur)
location = /index.html {
    if ($request_uri ~ "^/index\.html") { return 301 /; }
}

# EN ana sayfa kanonik: /en
location = /en { try_files /index-en.html =404; }
location = /index-en.html {
    if ($request_uri ~ "^/index-en\.html") { return 301 /en; }
}
location = /index-en { return 301 /en; }

# Diger tum .html'ler -> uzantisiz (sorgu korunur: p.html?id=x -> /p?id=x)
# panel.html bu kurala girmez; ana conf'taki "location = /panel.html" onceliklidir.
location ~ "^(?<temiz>/.+)\.html$" {
    if ($request_uri ~ "\.html") { return 301 $temiz$is_args$args; }
}
