<!DOCTYPE html>
<html lang="tr">
<!-- ============================================================
     OLIVAMORE /deneyim — WebAR Etiket Deneyimi (bağımsız prototip)

     SUNUCU NOTLARI:
     · HTTPS zorunlu (getUserMedia). Nginx + Let's Encrypt yeterli.
     · Permissions-Policy header'ı GEREKMEZ (varsayılan camera=self).
       Nginx'te global "Permissions-Policy: camera=()" varsa KALDIR.
       Sayfayı başka origin'de iframe'e gömersen: allow="camera" ekle.
     · targets.mind bu dosyayla AYNI klasörde olmalı.
       Üretim: https://hiukim.github.io/mind-ar-js-doc/tools/compile
       → etiket-target.png yükle → Start → targets.mind indir.

     DÜZENLENEBİLİR BÖLÜMLER (Ctrl+F ile ara):
     · [VIDEO KAYNAĞI]  · [ROZETLER]  · [AR METNİ]
     · [HİKAYE SAHNELERİ]  · [METİNLER-I18N]
     ============================================================ -->

<style>
/* ============ Marka kimliği (style.css'ten bağımsız kopya) ============ */
:root{--gold:#BFA25D;--gold-soft:#D3BC82;--ink:#1E1C19;--ink-soft:#4A463F;--line:#ECEAE6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Figtree','Segoe UI',sans-serif;background:#fff;color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 32px;border-radius:999px;font-size:.95rem;font-weight:500;letter-spacing:.05em;border:1px solid transparent;transition:all .25s}
.btn-dark{background:var(--ink);color:#fff}.btn-dark:active{background:#000}
.btn-gold{background:var(--gold);color:#fff}.btn-gold:active{background:#A68A4B}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.kicker{font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:700}

/* ============ Ekranlar ============ */
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;background:#fff;z-index:10}
.screen.on{display:flex}
.wordmark{height:20px;width:auto;margin-bottom:34px}
.screen h1{font-size:clamp(1.7rem,7vw,2.3rem);font-weight:700;line-height:1.2;margin:14px 0 12px}
.screen p.lead{color:var(--ink-soft);max-width:420px;font-size:1.02rem}
.lang-btn{position:fixed;top:18px;right:18px;z-index:60;border:1px solid var(--line);background:#fff;border-radius:4px;padding:5px 10px;font-size:.72rem;font-weight:700;letter-spacing:.12em}
.hint{font-size:.78rem;color:var(--ink-soft);margin-top:18px;max-width:360px}
.label-preview{width:120px;border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 34px rgba(30,28,25,.16);margin-bottom:8px}

/* AR ekranı */
#scr-ar{background:#000;padding:0;justify-content:flex-start}
#ar-container{position:absolute;inset:0}
#ar-container video{object-fit:cover}
.ar-hud{position:absolute;left:0;right:0;bottom:0;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;z-index:30;pointer-events:none}
.ar-hud .tip{background:rgba(30,28,25,.78);color:#fff;border-radius:999px;padding:10px 22px;font-size:.85rem;backdrop-filter:blur(6px)}
.ar-topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:16px;z-index:30}
.ar-topbar img{height:16px;filter:brightness(0) invert(1);opacity:.9}
.ar-exit{pointer-events:auto;background:rgba(30,28,25,.72);color:#fff;border:none;border-radius:999px;padding:9px 18px;font-size:.82rem;backdrop-filter:blur(6px)}
#ar-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0d0c0a;color:#EDE8DA;z-index:25;font-size:.92rem}
.spin{width:34px;height:34px;border:3px solid rgba(191,162,93,.25);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ Hikâye Modu ============ */
#scr-story{padding:0;background:#000}
.story-stage{position:absolute;inset:0;overflow:hidden}
.story-scene{position:absolute;inset:0;opacity:0;transition:opacity .5s;display:flex;flex-direction:column;justify-content:flex-end;padding:0 26px 96px;color:#fff;text-align:left}
.story-scene.on{opacity:1}
.story-scene .bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:-2}
.story-scene .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,13,10,.42) 0%,rgba(15,13,10,.10) 40%,rgba(15,13,10,.78) 100%);z-index:-1}
.story-scene .kicker{color:var(--gold-soft);margin-bottom:10px}
.story-scene h2{font-size:clamp(1.6rem,7.5vw,2.2rem);font-weight:700;line-height:1.22;margin-bottom:12px;max-width:480px}
.story-scene p{font-size:1rem;color:rgba(255,255,255,.88);max-width:440px}
.story-progress{position:absolute;top:14px;left:14px;right:64px;display:flex;gap:6px;z-index:40}
.story-progress i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.28);overflow:hidden}
.story-progress i b{display:block;height:100%;width:0;background:var(--gold-soft);transition:width .3s}
.story-progress i.done b{width:100%}
.story-tap{position:absolute;inset:0;z-index:35;display:flex}
.story-tap span{flex:1}
.story-close{position:absolute;top:26px;right:16px;z-index:45;background:rgba(30,28,25,.6);color:#fff;border:none;border-radius:999px;width:34px;height:34px;font-size:1rem}
.story-medals{display:flex;gap:12px;margin:16px 0 4px}
.story-medals img{height:52px;width:auto}

/* Bitiş + QR */
.cta-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:26px}
#qr-box{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 34px rgba(30,28,25,.10);padding:22px;margin:22px 0 6px}
#qr-box img,#qr-box canvas{display:block;width:200px;height:200px}
.url-fallback{font-size:.8rem;color:var(--ink-soft);word-break:break-all;max-width:320px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--ink);color:#fff;padding:12px 26px;border-radius:999px;font-size:.88rem;opacity:0;transition:all .3s;z-index:99;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

/* ============================================================
   Uygulama durumu + yardımcılar
   ============================================================ */
var LANG = (navigator.language || 'tr').toLowerCase().indexOf('tr') === 0 ? 'tr' : 'en';
var T = I18N[LANG];
var targetsAvailable = null;   // null=bilinmiyor, true/false
var arActive = false;

/* ?debug=1 ile telefonda ekranda log görebilirsin */
var DEBUG = new URLSearchParams(location.search).get('debug') === '1';
var dbgBox = null;
function dbg(msg, isWarn) {
  if (!DEBUG) return;
  if (!dbgBox) {
    dbgBox = document.createElement('div');
    dbgBox.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:38vh;overflow:auto;background:rgba(0,0,0,.85);color:#9f9;font:11px/1.5 monospace;padding:8px 10px;z-index:9999;pointer-events:auto;white-space:pre-wrap;';
    document.body.appendChild(dbgBox);
  }
  var line = document.createElement('div');
  line.textContent = msg;
  if (isWarn) line.style.color = '#fc6';
  dbgBox.appendChild(line);
  dbgBox.scrollTop = dbgBox.scrollHeight;
}
function log(msg) { console.log('[AR] ' + msg); dbg('[AR] ' + msg); }
function warn(msg) { console.warn('[AR] ' + msg); dbg('[AR] ' + msg, true); }
window.addEventListener('error', function (e) { dbg('[JS HATA] ' + e.message + ' @ ' + (e.filename || '').split('/').pop() + ':' + e.lineno, true); });

function applyLang() {
  T = I18N[LANG];
  document.documentElement.lang = LANG;
  document.getElementById('lang-btn').textContent = LANG === 'tr' ? 'EN' : 'TR';
  document.querySelectorAll('[data-t]').forEach(function (el) {
    var v = T[el.dataset.t];
    if (v) el.textContent = v;
  });
  buildStory(); // sahne metinlerini yeniden kur
}
document.getElementById('lang-btn').addEventListener('click', function () {
  LANG = LANG === 'tr' ? 'en' : 'tr';
  applyLang();
});

function show(id) {
  document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('on'); });
  document.getElementById(id).classList.add('on');
}
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(function () { t.classList.remove('show'); }, 2200);
}

/* ============================================================
   Açılış kontrolleri: masaüstü / story parametresi / yetenekler
   ============================================================ */
var isDesktop = window.matchMedia('(pointer:fine)').matches && window.innerWidth > 820 && !('ontouchstart' in window);
var forceStory = new URLSearchParams(location.search).get('mode') === 'story';

function webglOK() {
  try { var c = document.createElement('canvas'); return !!(c.getContext('webgl') || c.getContext('experimental-webgl')); }
  catch (e) { return false; }
}

function checkTargets() {
  return fetch('./targets.mind', { method: 'HEAD' })
    .then(function (r) {
      targetsAvailable = r.ok;
      if (!r.ok) warn('targets.mind bulunamadı (HTTP ' + r.status + ') → Hikâye Modu fallback');
      return r.ok;
    })
    .catch(function (e) { targetsAvailable = false; warn('targets.mind fetch hatası: ' + e.message); return false; });
}

function boot() {
  applyLang();
  if (forceStory) { log('?mode=story → Hikâye Modu'); startStory(); return; }
  if (isDesktop) { log('Masaüstü algılandı → QR ekranı'); showDesktopQR(); return; }
  if (!webglOK()) { warn('WebGL desteklenmiyor → Hikâye Modu'); startStory(); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { warn('getUserMedia yok → Hikâye Modu'); startStory(); return; }
  checkTargets(); // arka planda; buton tıklanınca sonucu kullanılır
  show('scr-welcome');
}

/* ============================================================
   MASAÜSTÜ QR — qrcode-generator CDN'den koşullu yüklenir,
   yüklenemezse düz URL gösterilir
   ============================================================ */
function showDesktopQR() {
  show('scr-desktop');
  var url = location.href.split('?')[0];
  document.getElementById('qr-url').textContent = url;
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js';
  s.onload = function () {
    try {
      var qr = qrcode(0, 'M');
      qr.addData(url);
      qr.make();
      document.getElementById('qr-box').innerHTML = qr.createImgTag(5, 8);
      log('QR üretildi: ' + url);
    } catch (e) { warn('QR üretilemedi: ' + e.message); }
  };
  s.onerror = function () { warn('QR kütüphanesi yüklenemedi, URL gösteriliyor'); };
  document.head.appendChild(s);
}
document.getElementById('btn-desktop-story').addEventListener('click', startStory);

/* ============================================================
   AR MODU — kütüphaneler buton tıklamasında yüklenir
   Sıra: A-Frame 1.5.0 → mind-ar 1.2.5 (test edilmiş kombinasyon)
   ============================================================ */
/* Önce kendi sunucumuzdaki kopya, olmazsa CDN'ler (jsdelivr TR'de bazen engelli) */
var AFRAME_URLS = [
  'assets/vendor/aframe.min.js',
  'https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe.min.js',
  'https://unpkg.com/aframe@1.5.0/dist/aframe.min.js'
];
var MINDAR_URLS = [
  'assets/vendor/mindar-image-aframe.prod.js',
  'https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image-aframe.prod.js',
  'https://unpkg.com/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js'
];

function loadScript(src) {
  return new Promise(function (res, rej) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = res;
    s.onerror = function () { rej(new Error('Yüklenemedi: ' + src)); };
    document.head.appendChild(s);
  });
}
// Sırayla dene: ilk başarılı olan kazanır
async function loadFirst(urls, check) {
  for (var i = 0; i < urls.length; i++) {
    if (check()) return;
    try {
      await loadScript(urls[i]);
      log('Yüklendi: ' + urls[i]);
      if (check()) return;
    } catch (e) { warn(e.message + ' — sıradaki kaynak deneniyor'); }
  }
  if (!check()) throw new Error('Hiçbir kaynaktan yüklenemedi');
}

document.getElementById('btn-start').addEventListener('click', async function () {
  var btn = this;
  btn.disabled = true;

  // 1) targets.mind kontrolü (açılışta başladıysa sonucu bekle)
  if (targetsAvailable === null) await checkTargets();
  if (!targetsAvailable) { startStory(); btn.disabled = false; return; }

  // 2) Kamera izni — iOS kuralı: kullanıcı etkileşimi içinde iste
  try {
    var probe = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    probe.getTracks().forEach(function (t) { t.stop(); }); // izin alındı, MindAR kendi stream'ini açacak
    log('Kamera izni verildi');
  } catch (e) {
    warn('Kamera izni reddedildi/başarısız (' + e.name + ') → Hikâye Modu');
    startStory();
    btn.disabled = false;
    return;
  }

  // 3) Kütüphaneleri yükle (önce A-Frame, sonra mind-ar; yerel → CDN sırasıyla)
  show('scr-ar');
  document.getElementById('ar-loading').style.display = 'flex';
  try {
    await loadFirst(AFRAME_URLS, function () { return !!window.AFRAME; });
    await loadFirst(MINDAR_URLS, function () { return !!(window.AFRAME && AFRAME.components['mindar-image']); });
  } catch (e) {
    warn('Kütüphane yüklenemedi: ' + e.message + ' → Hikâye Modu');
    startStory();
    btn.disabled = false;
    return;
  }

  buildARScene();
  btn.disabled = false;
});

function buildARScene() {
  arActive = true;
  var c = document.getElementById('ar-container');

  /* ---- Sahne markup'ı ----
     [ROZETLER]: iki madalya plane'i — görselleri değiştirebilirsin.
     [AR METNİ]: I18N.arOverlayText içinde. */
  c.innerHTML =
    '<a-scene id="ar-scene" mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no"' +
    ' color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>' +
    '  <a-assets>' +
    '    <img id="tex-medal1" src="assets/img/medal-london.png">' +
    '    <img id="tex-medal2" src="assets/img/medal-japan.png">' +
    '  </a-assets>' +
    '  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>' +
    '  <a-entity id="ar-anchor" mindar-image-target="targetIndex: 0">' +
    /* [VIDEO KAYNAĞI] video plane — etiketin üst yarısını kaplar */
    '    <a-video id="ar-video-plane" src="#ar-video" position="0 0.55 0" width="0.95" height="0.55" visible="false"></a-video>' +
    /* [ROZETLER] iki madalya, etiketin altında yan yana */
    '    <a-plane material="src: #tex-medal1; transparent: true" position="-0.28 -0.75 0" width="0.42" height="0.42" visible="false" class="ar-badge"></a-plane>' +
    '    <a-plane material="src: #tex-medal2; transparent: true" position="0.28 -0.75 0" width="0.42" height="0.42" visible="false" class="ar-badge"></a-plane>' +
    /* [AR METNİ] beyaz şerit + metin, etiketin hemen altında */
    '    <a-plane color="#FFFFFF" position="0 -0.28 0" width="1.05" height="0.34" visible="false" class="ar-badge" material="opacity: 0.92"></a-plane>' +
    '    <a-text id="ar-text" value="" color="#1E1C19" align="center" position="0 -0.28 0.01" width="1.6" visible="false" class="ar-badge"></a-text>' +
    '  </a-entity>' +
    '</a-scene>';

  var scene = document.getElementById('ar-scene');
  var anchor = document.getElementById('ar-anchor');
  var video = document.getElementById('ar-video');
  document.getElementById('ar-text').setAttribute('value', T.arOverlayText);

  scene.addEventListener('arReady', function () {
    document.getElementById('ar-loading').style.display = 'none';
    log('arReady: kamera açık, etiket aranıyor');
  });
  scene.addEventListener('arError', function (ev) {
    warn('arError: MindAR başlatılamadı (' + (ev && ev.detail ? JSON.stringify(ev.detail) : 'detay yok') + ') → Hikâye Modu');
    disposeAR(true);
  });

  anchor.addEventListener('targetFound', function () {
    log('targetFound: etiket tanındı');
    document.getElementById('ar-tip').textContent = T.arFound;
    anchor.querySelectorAll('.ar-badge, #ar-video-plane').forEach(function (el) { el.setAttribute('visible', 'true'); });
    video.play().catch(function (e) { warn('Video oynatılamadı (' + e.message + ') — [VIDEO KAYNAĞI] yolunu kontrol et'); });
  });
  anchor.addEventListener('targetLost', function () {
    log('targetLost: etiket kayboldu');
    document.getElementById('ar-tip').textContent = T.arTip;
    anchor.querySelectorAll('.ar-badge, #ar-video-plane').forEach(function (el) { el.setAttribute('visible', 'false'); });
    video.pause();
  });

  // Video dosyası yoksa plane'i tamamen gizle, deneyim rozet+metinle sürsün
  video.onerror = function () { warn('[VIDEO KAYNAĞI] bulunamadı: ' + video.src + ' — video plane devre dışı'); };
}

/* ---- AR çıkışı: sahne + kamera stream temizliği ---- */
function disposeAR(fallbackToStory) {
  var scene = document.getElementById('ar-scene');
  try {
    if (scene && scene.systems['mindar-image-system']) scene.systems['mindar-image-system'].stop();
  } catch (e) { warn('MindAR stop hatası: ' + e.message); }
  document.getElementById('ar-video').pause();
  // MindAR'ın açtığı kamera stream'ini kapat
  document.querySelectorAll('video').forEach(function (v) {
    if (v.srcObject) {
      v.srcObject.getTracks().forEach(function (t) { t.stop(); });
      v.srcObject = null;
    }
  });
  document.getElementById('ar-container').innerHTML = '';
  arActive = false;
  log('AR sahnesi ve kamera stream\'i temizlendi');
  if (fallbackToStory) startStory();
  else show('scr-end');
}
document.getElementById('btn-ar-exit').addEventListener('click', function () { disposeAR(false); });

/* ============================================================
   HİKÂYE MODU — bağımsız, 4 sahne, tap/swipe
   ============================================================ */
var sceneIdx = 0;
function buildStory() {
  var stage = document.getElementById('story-stage');
  var prog = document.getElementById('story-progress');
  stage.innerHTML = '';
  prog.innerHTML = '';
  T.scenes.forEach(function (s, i) {
    var d = document.createElement('div');
    d.className = 'story-scene' + (i === sceneIdx ? ' on' : '');
    d.innerHTML = '<div class="bg" style="background-image:url(\'' + s.bg + '\')"></div><div class="shade"></div>' +
      '<div class="kicker">' + s.kicker + '</div><h2>' + s.title + '</h2><p>' + s.text + '</p>';
    stage.appendChild(d);
    var p = document.createElement('i');
    p.innerHTML = '<b></b>';
    if (i < sceneIdx) p.className = 'done';
    prog.appendChild(p);
  });
}
function gotoScene(i) {
  if (i < 0) i = 0;
  if (i >= T.scenes.length) { show('scr-end'); log('Hikâye tamamlandı'); return; }
  sceneIdx = i;
  document.querySelectorAll('.story-scene').forEach(function (s, k) { s.classList.toggle('on', k === i); });
  document.querySelectorAll('.story-progress i').forEach(function (p, k) { p.classList.toggle('done', k < i); });
}
function startStory() {
  sceneIdx = 0;
  buildStory();
  show('scr-story');
  log('Hikâye Modu başladı');
}
document.getElementById('btn-story').addEventListener('click', startStory);
document.getElementById('btn-story-close').addEventListener('click', function () { show('scr-welcome'); });

// tap: sol üçte bir geri, kalanı ileri
document.getElementById('story-tap').addEventListener('click', function (e) {
  var x = e.clientX / window.innerWidth;
  gotoScene(x < 0.33 ? sceneIdx - 1 : sceneIdx + 1);
});
// swipe
var swX = null;
document.getElementById('story-tap').addEventListener('touchstart', function (e) { swX = e.touches[0].clientX; }, { passive: true });
document.getElementById('story-tap').addEventListener('touchend', function (e) {
  if (swX === null) return;
  var dx = e.changedTouches[0].clientX - swX;
  swX = null;
  if (Math.abs(dx) > 50) gotoScene(dx < 0 ? sceneIdx + 1 : sceneIdx - 1);
}, { passive: true });

/* ============================================================
   BİTİŞ: paylaş + tekrar
   ============================================================ */
document.getElementById('btn-share').addEventListener('click', async function () {
  var url = location.href.split('?')[0];
  if (navigator.share) {
    try { await navigator.share({ title: 'Olivamore', text: T.shareText, url: url }); log('Web Share ile paylaşıldı'); }
    catch (e) { log('Paylaşım iptal: ' + e.message); }
  } else {
    try { await navigator.clipboard.writeText(url); toast(T.copied); }
    catch (e) {
      var ta = document.createElement('textarea');
      ta.value = url; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove(); toast(T.copied);
    }
  }
});
document.getElementById('btn-replay').addEventListener('click', function () { show('scr-welcome'); });

boot();
</script>
